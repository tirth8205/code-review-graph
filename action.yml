# Composite GitHub Action: risk-scored, graph-aware PR review comments.
# Local-first — the analysis runs entirely on the runner; no source code is
# sent to any external service. See docs/GITHUB_ACTION.md for usage.
name: "code-review-graph PR Review"
description: >-
  Post a risk-scored, graph-aware review comment on pull requests.
  Local-first: builds a Tree-sitter knowledge graph on the runner and
  analyzes change impact without sending code to external services.
author: "Tirth"
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  github-token:
    description: >-
      Token used to post the sticky PR comment via the GitHub API.
      Needs `pull-requests: write` (the default GITHUB_TOKEN works).
    required: true
  comment:
    description: "Post (and keep updated) a sticky PR comment with the report."
    required: false
    default: "true"
  fail-on-risk:
    description: >-
      Fail the job when the overall risk score reaches this level:
      none (never fail), high (risk >= 0.70), or critical (risk >= 0.85).
    required: false
    default: "none"
  python-version:
    description: "Python version used to run code-review-graph."
    required: false
    default: "3.12"

outputs:
  comment-file:
    description: >-
      Runner-local path to the rendered markdown report. Use with
      `comment: false` when a separate trusted workflow will publish it.
    value: ${{ steps.render.outputs.comment-file }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install code-review-graph
      shell: bash
      run: python -m pip install --quiet code-review-graph

    # Cache the SQLite knowledge graph between runs. The "schema14" segment
    # tracks LATEST_VERSION in code_review_graph/migrations.py — bump it when
    # the database schema changes so stale caches are not restored.
    - name: Cache knowledge graph
      uses: actions/cache@v6
      with:
        path: .code-review-graph
        key: code-review-graph-schema14-${{ runner.os }}-${{ hashFiles('**/uv.lock', '**/poetry.lock', '**/requirements*.txt', '**/Pipfile.lock', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/go.sum', '**/Cargo.lock', '**/Gemfile.lock', '**/composer.lock') }}
        restore-keys: |
          code-review-graph-schema14-${{ runner.os }}-

    - name: Resolve diff base
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "${BASE_REF}" ]; then
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          echo "CRG_BASE=origin/${BASE_REF}" >> "${GITHUB_ENV}"
        else
          # Not a pull_request event — fall back to the previous commit.
          echo "CRG_BASE=HEAD~1" >> "${GITHUB_ENV}"
        fi

    - name: Build or update the graph
      shell: bash
      run: |
        if [ -f .code-review-graph/graph.db ]; then
          # Cache hit: re-parse only the files that differ from the base ref.
          # If the restored database is unusable, fall back to a full build.
          # A corrupt, foreign or newer-schema cache now says so in one line
          # and exits 1, which is exactly what this `||` is here to recover
          # from; a full build then replaces it.
          code-review-graph update --base "${CRG_BASE}" || code-review-graph build
        else
          code-review-graph build
        fi

    # No `|| true` here, on purpose. detect-changes exits non-zero when it
    # cannot determine the changes (no git, a git that timed out, an
    # unreadable graph). Swallowing that would post a reassuring comment
    # about a pull request nobody analyzed.
    - name: Run risk-scored change analysis
      shell: bash
      run: |
        code-review-graph detect-changes --base "${CRG_BASE}" \
          > "${RUNNER_TEMP}/crg-report.json"

    # Renders on exit 0 (an analysis, or a genuinely unchanged tree) and on
    # exit 4 (output that is neither): the exit-4 comment says the analysis
    # did not run, and the step below fails the job so the gate cannot be
    # mistaken for a pass. Any other exit code is a real error and stops here.
    - name: Render markdown report
      id: render
      shell: bash
      run: |
        set +e
        python "${GITHUB_ACTION_PATH}/scripts/render_pr_comment.py" \
          --input "${RUNNER_TEMP}/crg-report.json" \
          --output "${RUNNER_TEMP}/crg-comment.md"
        status=$?
        set -e
        if [ "${status}" -ne 0 ] && [ "${status}" -ne 4 ]; then
          exit "${status}"
        fi
        echo "RENDER_STATUS=${status}" >> "${GITHUB_ENV}"
        echo "comment-file=${RUNNER_TEMP}/crg-comment.md" >> "${GITHUB_OUTPUT}"

    - name: Upsert sticky PR comment
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        marker='<!-- code-review-graph-report -->'
        # Only ever edit a comment this Action itself posted. The marker is
        # published in docs/GITHUB_ACTION.md, so any pull request
        # participant can post a comment carrying it; without an author
        # filter the Action would adopt that comment and every later run
        # would rewrite it (or stall on it) instead of keeping its own
        # report.
        #
        # A personal access token answers `gh api user` with its own login,
        # so that identity is exact. An installation token (the default
        # GITHUB_TOKEN, or a GitHub App's) cannot call that endpoint at all,
        # and its comments are authored by a bot account whose login this
        # step has no way to learn: github-actions[bot] for the default
        # token, <app-slug>[bot] for an App. Assuming github-actions[bot]
        # there loses an App's own sticky comment and posts a duplicate on
        # every run, so the fallback matches on what is actually knowable --
        # a marker comment written by a bot. Pull request participants are
        # Users, never Bots, so the marker is still not enough on its own.
        author=$(gh api user --jq '.login' 2>/dev/null || true)
        if [ -n "${author}" ]; then
          author_filter=".user.login == \"${author}\""
        else
          author_filter='.user.type == "Bot"'
        fi
        comment_id=$(gh api \
          "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
          --paginate \
          --jq ".[] | select(${author_filter} and
                 (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
        if [ -n "${comment_id}" ]; then
          gh api --method PATCH --silent \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
            -F body=@"${RUNNER_TEMP}/crg-comment.md"
        else
          gh api --method POST --silent \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F body=@"${RUNNER_TEMP}/crg-comment.md"
        fi

    # Always runs, even with fail-on-risk: none. "No analysis happened" is
    # not a risk level, so it is not something the risk gate can be
    # configured to ignore.
    - name: Fail when the analysis did not run
      shell: bash
      run: |
        if [ "${RENDER_STATUS:-0}" -eq 4 ]; then
          echo "::error::code-review-graph could not determine the changes;" \
            "this pull request has NOT been analyzed."
          exit 1
        fi

    - name: Enforce risk gate
      if: ${{ inputs.fail-on-risk != 'none' }}
      shell: bash
      env:
        FAIL_ON_RISK: ${{ inputs.fail-on-risk }}
      run: |
        python "${GITHUB_ACTION_PATH}/scripts/render_pr_comment.py" \
          --input "${RUNNER_TEMP}/crg-report.json" \
          --fail-on-risk "${FAIL_ON_RISK}" \
          --quiet
