name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the check below can see main.
          fetch-depth: 0

      # A release can name a tag on any branch. Only code that reached main
      # through the reviewed promotions may go to PyPI.
      - name: Refuse a tag that is not on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error title=Tag not on main::Release tag ${TAG} points at ${commit}, which is not on main. Tag the merge commit on main and publish the release again."
            exit 1
          fi
          echo "Release tag ${TAG} (${commit}) is on main."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
