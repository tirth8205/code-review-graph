# The soak that runs on `testing`, after a change has already passed CI on `staging`.
#
# It reruns everything CI runs and adds the slower suites CI skips. When anything
# fails, promotion stops here and an issue says what to fix on `staging`. When
# everything passes, an issue says `testing` is ready and names the one command that
# opens the promotion pull request. Nothing here can write to `main`.
#
# The coverage gate is REPORTED, NOT ENFORCED. Its rows are accurate — every one
# names a changed function that no test calls — but "no test calls this" is not
# "this is untested": on the `staging`-to-`main` delta it was built against, 47 of
# its 114 rows name helpers a test does execute, two calls away. Blocking a
# promotion on a signal that is 41% "run but not directly tested" would train
# everyone to override it. The verdict prints the number and links the report; the
# maintainer decides. To enforce it, drop `continue-on-error` from the `test-gaps`
# job and require `needs.test-gaps.result == 'success'` in the verdict.
name: Testing gauntlet

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-gauntlet
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" pytest-cov
      - run: pytest --tb=short -q --cov=code_review_graph --cov-report=term-missing --cov-fail-under=65

  e2e:
    name: End to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run the end-to-end suite
        shell: bash
        run: |
          set +e
          pytest -m e2e -q
          status=$?
          # 5 means the marker selected nothing, which is not a failure.
          if [ "$status" = "5" ]; then
            echo "::notice::no tests carry the e2e marker yet"
            exit 0
          fi
          exit "$status"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install bandit[toml]
      - run: bandit -c pyproject.toml -r code_review_graph/ -q

  test-gaps:
    # Advisory: the step goes red on a finding so the checks list shows it, and
    # `continue-on-error` keeps that from failing the run. See the note at the
    # top of the file. `gaps` carries the finding to the verdict.
    name: Test-coverage report (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      gaps: ${{ steps.gate.outputs.gaps }}
      headline: ${{ steps.gate.outputs.headline }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Build the graph for this commit
        # The gate refuses to report on a graph that does not match the
        # checkout, so this build is a hard prerequisite, not a convenience.
        run: code-review-graph build --repo .
      - name: Look for changed functions with no test
        id: gate
        run: |
          set +e
          python scripts/test_gap_gate.py --repo . --base origin/main \
            --out "$RUNNER_TEMP/test-gaps.md" 2>&1 | tee "$RUNNER_TEMP/gate.log"
          status=${PIPESTATUS[0]}
          set -e
          # One line, from our own script, for the verdict issue. `tr` guards
          # the step output against anything multi-line reaching $GITHUB_OUTPUT.
          headline=$(grep -m1 -E '^(base=|error:)' "$RUNNER_TEMP/gate.log" \
            | tr -d '\r\n' | cut -c1-300)
          echo "headline=$headline" >> "$GITHUB_OUTPUT"
          if [ "$status" = "0" ]; then
            echo "gaps=none" >> "$GITHUB_OUTPUT"
            echo "### Every changed function has a test" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$headline" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Both remaining branches leave this step red, so the job reports the
          # finding honestly in the checks list. `continue-on-error` on the job
          # is what stops that from failing the run; the verdict reads the
          # `gaps` output, which is written before the exit.
          if [ "$status" = "2" ]; then
            # The analysis could not be trusted — no graph, a stale graph, or a
            # crash. Reporting "no gaps" here is what the first version did.
            echo "gaps=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::the coverage analysis could not run; see the log"
            echo "### Coverage analysis did not run" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/gate.log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "gaps=found" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/test-gaps.md" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-gaps
          path: ${{ runner.temp }}/test-gaps.md
          if-no-files-found: ignore

  verdict:
    name: Promotion verdict
    needs: [suite, e2e, security, test-gaps]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ needs.suite.result }}
          E2E: ${{ needs.e2e.result }}
          SECURITY: ${{ needs.security.result }}
          GAPS: ${{ needs.test-gaps.outputs.gaps }}
          GAPS_HEADLINE: ${{ needs.test-gaps.outputs.headline }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="testing is ready to promote to main"
          subject=$(git log -1 --format='%s' "$SHA")
          # The coverage report is advisory: it appears in the issue, it never
          # decides it. See the note at the top of this file.
          case "$GAPS" in
            none) coverage="no changed function is without a test" ;;
            found) coverage="changed functions with no test of their own — see the run summary" ;;
            unknown) coverage="the analysis could not run" ;;
            *) coverage="not reported" ;;
          esac
          if [ -n "${GAPS_HEADLINE:-}" ]; then
            coverage="$coverage (\`$GAPS_HEADLINE\`)"
          fi
          if [ "$SUITE" = "success" ] && [ "$E2E" = "success" ] \
             && [ "$SECURITY" = "success" ]; then
            {
              echo "\`testing\` is green at \`${SHA:0:7}\` ($subject)."
              echo
              echo "Full suite on 3.10 to 3.13, end to end on Linux, macOS and Windows,"
              echo "and the security scan."
              echo
              echo "Coverage of the change (advisory, does not gate): $coverage."
              echo
              echo "Nothing is promoted automatically from here. To open the pull request"
              echo "into \`main\`, run:"
              echo
              echo '```bash'
              echo "gh pr create --base main --head testing --title \"Promote testing to main\""
              echo '```'
              echo
              echo "Merging that pull request is the only way code reaches \`main\`, and only"
              echo "you can do it."
              echo
              echo "Run: $RUN_URL"
            } > body.md
            state_label="ready-to-promote"
          else
            {
              echo "\`testing\` is not promotable at \`${SHA:0:7}\` ($subject)."
              echo
              echo "| Stage | Result |"
              echo "| --- | --- |"
              echo "| Full suite | $SUITE |"
              echo "| End to end | $E2E |"
              echo "| Security | $SECURITY |"
              echo "| Coverage of the change (advisory) | $coverage |"
              echo
              if [ "$GAPS" = "found" ]; then
                echo "The run summary lists every changed function no test calls, and marks"
                echo "the ones a test does reach indirectly. Adding those tests is worthwhile"
                echo "but is not what is blocking this promotion."
                echo
              fi
              echo "Run: $RUN_URL"
            } > body.md
            state_label="blocked"
          fi
          existing=$(gh issue list --state open --label promotion-status \
            --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file body.md \
              --add-label "$state_label" >/dev/null
            gh issue comment "$existing" --body "Updated for \`${SHA:0:7}\`: $state_label. $RUN_URL" >/dev/null
          else
            gh issue create --title "$title" --body-file body.md \
              --label promotion-status --label "$state_label" >/dev/null
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
